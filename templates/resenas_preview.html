<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseñas Google</title>
<!--TEMPLE_THEME-->
<style>
/* Estilos propios de la vista Reseñas (el sistema común está en static/temple-retail.css) */
.wrap{padding:24px}
.stars{color:var(--t-slate);letter-spacing:1px;white-space:nowrap;font-size:12px}
.stars.low{color:var(--t-pink)}
.rating-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.local-cell{display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap}

/* Reseñas recientes por local */
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.reviews-local{background:var(--t-card);border:1px solid var(--t-rule);border-top:4px solid var(--brand,var(--t-slate));border-radius:var(--t-radius);min-width:0}
.reviews-local-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--t-rule);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.reviews-local-head span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reviews-local-head span:last-child{white-space:nowrap;letter-spacing:0}
.review-card{padding:12px 16px;border-bottom:1px solid var(--t-rule)}
.review-card:last-child{border-bottom:none}
.review-header{display:flex;align-items:baseline;gap:8px;min-width:0}
.review-author{font-size:12px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review-time{font-size:11px;color:var(--t-muted);margin-left:auto;white-space:nowrap}
.review-text{font-size:12px;color:var(--t-muted);line-height:1.5;margin-top:6px;overflow-wrap:anywhere}

/* Tendencia */
.trend-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(60px,140px) auto;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--t-rule)}
.trend-row:last-child{border-bottom:none}
.trend-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0}
.trend-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend-delta{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;min-width:70px}
.trend-spark svg{width:100%;height:28px;display:block}

@media (max-width:768px){.wrap{padding:16px}}
</style>
</head>
<body>
<div class="wrap">

<div class="sec-hd">
  <div class="sec-title">Reseñas Google</div>
  <div class="sec-note">Snapshot: <span id="snapshotLabel">—</span> &middot; Marca: <span id="marcaLabel">Todas</span></div>
</div>

<div id="sinDatosWarn" class="t-alert">Sin locales con reseñas para esta marca.</div>

<section class="sec grid g-220" id="kpiRow"></section>

<!-- Sección 1: Ranking de locales por rating -->
<section class="sec card" style="padding-bottom:0">
  <div class="card-hd">
    <div><h2>Ranking de locales &middot; Rating Google</h2></div>
    <div class="seg" id="sortCtrl">
      <button class="fb active" onclick="setSortDir('desc',this)">Mejor &rarr; peor</button>
      <button class="fb" onclick="setSortDir('asc',this)">Peor &rarr; mejor</button>
    </div>
  </div>
  <div class="table-scroll bleed">
    <table style="min-width:680px">
      <thead>
        <tr>
          <th>#</th>
          <th>Local</th>
          <th>Rating</th>
          <th class="r">vs snapshot ant.</th>
          <th class="r">Total reseñas</th>
          <th>Alerta</th>
        </tr>
      </thead>
      <tbody id="rankingBody"></tbody>
    </table>
  </div>
</section>

<!-- Sección 2: Tarjetas de reseñas recientes por local -->
<section class="sec">
  <div class="sec-hd">
    <div class="sec-title">Reseñas recientes por local</div>
    <div class="sec-note" id="cardsNote">Últimos 60 días &middot; hasta 3 por local</div>
  </div>
  <div class="reviews-grid" id="cardsWrap"></div>
</section>

<!-- Sección 3: Tendencia de rating (sparkline + delta por período) -->
<section class="sec card">
  <div class="card-hd">
    <div><h2>Tendencia &middot; Evolución de rating</h2></div>
    <div class="seg" id="tendCtrl">
      <button class="fb" onclick="setTendenciaPeriodo(7,this)">7 días</button>
      <button class="fb active" onclick="setTendenciaPeriodo(30,this)">30 días</button>
      <button class="fb" onclick="setTendenciaPeriodo(90,this)">90 días</button>
    </div>
  </div>
  <div id="tendenciaBody"></div>
</section>

</div>

<script>
// Forma esperada de __RESENAS_JSON__ (inyectada por el script de build):
// {
//   "fecha_snapshot": "2026-07-21",
//   "por_marca": {
//     "TEMPLE":    [ { "marca","local","place_id","rating","total_reviews",
//                       "rating_prev_snapshot", "is_alert": bool,
//                       "reviews":[{"author_name","rating","relative_time_description","date_str","text"}] }, ... ],
//     "PATAGONIA": [ ... ],
//     "FERIADO":   [ ... ]
//   }
// }
const RESENAS = __RESENAS_JSON__;

var _marca   = 'TODAS';
var _sortDir = 'desc'; // 'desc' = mejor a peor (rating), 'asc' = peor a mejor

// Colores de marca del sistema TEMPLE (mismos que BCOLOR en templates/dashboard.html)
var MARCA_COLORS = {TEMPLE:'#D41367', PATAGONIA:'#18988B', FERIADO:'#FFDD00'};
var MARCA_LBL = {TODAS:'Todas', TEMPLE:'Temple', PATAGONIA:'Patagonia', FERIADO:'Feriado'};

function getLocalesForMarca(){
  var por = (RESENAS && RESENAS.por_marca) ? RESENAS.por_marca : {};
  if(_marca === 'TODAS'){
    return ['TEMPLE','PATAGONIA','FERIADO'].reduce(function(acc, k){
      return acc.concat(por[k] || []);
    }, []);
  }
  return por[_marca] || [];
}

function setMarca(m){
  _marca = m || 'TODAS';
  var lbl = document.getElementById('marcaLabel');
  if(lbl) lbl.textContent = MARCA_LBL[_marca] || _marca;
  render();
}

window.addEventListener('message', function(e){
  if(!e.data) return;
  if(e.data.type === 'setMarca'){
    setMarca(e.data.marca || 'TODAS');
  } else if(e.data.type === 'setPeriodo'){
    // Reseñas no tiene dimensión de período (solo snapshot más reciente) — se ignora.
  }
});

function updateSnapshotLabel(){
  var el = document.getElementById('snapshotLabel');
  var f = RESENAS && RESENAS.fecha_snapshot;
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f||'');
  if(el) el.textContent = m ? m[3]+'/'+m[2]+'/'+m[1] : (f || '—');
}

function starsHtml(rating){
  var r = Math.round(Number(rating) || 0);
  r = Math.max(0, Math.min(5, r));
  return '<span class="stars'+(r<=2?' low':'')+'">'+'★'.repeat(r) + '☆'.repeat(5 - r)+'</span>';
}

function fmtRating(rating){
  var n = Number(rating);
  return isNaN(n) ? '—' : n.toFixed(1).replace('.',',');
}

function truncate(text, n){
  if(!text) return '';
  return text.length > n ? text.slice(0, n) + '…' : text;
}

function marcaDot(marca){
  var mc = MARCA_COLORS[marca] || '#323E48';
  return '<span class="t-dot" data-m="'+(marca||'')+'" style="background:'+mc+'"></span>';
}

/* KPIs: rating ponderado por cantidad de reseñas, total, alertas activas y locales < 4,2 */
function renderKpis(locales){
  var el = document.getElementById('kpiRow');
  if(!el) return;
  if(!locales.length){ el.innerHTML=''; return; }
  var tot = locales.reduce(function(a,l){ return a + (l.total_reviews||0); }, 0);
  var avg = tot ? locales.reduce(function(a,l){ return a + (Number(l.rating)||0)*(l.total_reviews||0); }, 0)/tot : 0;
  var alertas = locales.filter(function(l){ return l.is_alert; }).length;
  var bajo42 = locales.filter(function(l){ return l.rating != null && Number(l.rating) < 4.2; }).length;
  function card(lbl, val, sub, cls){
    return '<div class="kpi-card"><div class="kpi-lbl">'+lbl+'</div><div class="kpi-val sm'+(cls?' '+cls:'')+'">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';
  }
  el.innerHTML =
    card('Rating promedio', avg ? avg.toFixed(2).replace('.',',')+' ★' : '—', 'ponderado por cantidad de reseñas') +
    card('Total reseñas', tot.toLocaleString('es-AR'), locales.length+' locales con ficha en Google') +
    card('Alertas activas', alertas, 'reseñas negativas nuevas sin gestionar', alertas ? 'neg' : '') +
    card('Locales < 4,2', bajo42, 'rating debajo de 4,2', bajo42 ? 'neg' : '');
}

function sortedLocales(locales){
  var arr = locales.slice();
  arr.sort(function(a, b){
    var ra = Number(a.rating) || 0, rb = Number(b.rating) || 0;
    return _sortDir === 'desc' ? rb - ra : ra - rb;
  });
  return arr;
}

function setSortDir(dir, btn){
  _sortDir = dir;
  document.querySelectorAll('#sortCtrl .fb').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  renderRanking(getLocalesForMarca());
}

function renderRanking(locales){
  var body = document.getElementById('rankingBody');
  if(!body) return;
  var arr = sortedLocales(locales);
  if(!arr.length){
    body.innerHTML = '<tr><td colspan="6" class="empty">Sin datos para esta selección</td></tr>';
    return;
  }
  body.innerHTML = arr.map(function(l, i){
    var alertCell = l.is_alert
      ? '<span class="t-chip t-chip-neg">Reseña negativa nueva</span>'
      : '<span class="muted">—</span>';
    var dCell = '<td class="r muted">—</td>';
    if(l.rating != null && l.rating_prev_snapshot != null){
      var d = Math.round((Number(l.rating) - Number(l.rating_prev_snapshot))*10)/10;
      if(d > 0)      dCell = '<td class="r strong pos">▲ +'+d.toFixed(1).replace('.',',')+'</td>';
      else if(d < 0) dCell = '<td class="r strong neg">▼ '+d.toFixed(1).replace('.',',')+'</td>';
    }
    return '<tr>'
      +'<td class="muted">'+(i+1)+'</td>'
      +'<td><span class="local-cell">'+marcaDot(l.marca)+'<b>'+(l.local || '—')+'</b><span class="muted" style="font-size:12px">'+(MARCA_LBL[l.marca]||l.marca||'')+'</span></span></td>'
      +'<td><span class="rating-cell">'+starsHtml(l.rating)+'<b>'+fmtRating(l.rating)+'</b></span></td>'
      +dCell
      +'<td class="r">'+(l.total_reviews != null ? Number(l.total_reviews).toLocaleString('es-AR') : '—')+'</td>'
      +'<td>'+alertCell+'</td>'
      +'</tr>';
  }).join('');
}

var RESENAS_DIAS_UMBRAL = 60; // umbral de "actual" para la sección de tarjetas recientes

function parseReviewDate(r){
  if(r.time) return new Date(r.time * 1000);
  if(r.date_str){
    var parts = r.date_str.split('/');
    if(parts.length === 3){
      return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
    }
  }
  return null;
}

function isReviewRecent(r, dias){
  var d = parseReviewDate(r);
  if(!d || isNaN(d.getTime())) return false;
  var limiteMs = dias * 24 * 60 * 60 * 1000;
  return (Date.now() - d.getTime()) <= limiteMs;
}

function reviewCardHtml(r){
  var timeParts = [];
  if(r.relative_time_description) timeParts.push(r.relative_time_description);
  if(r.date_str) timeParts.push(r.date_str);
  var timeStr = timeParts.join(' · ');
  return '<div class="review-card">'
    +'<div class="review-header">'
      +starsHtml(r.rating)
      +'<span class="review-author">'+(r.author_name || 'Anónimo')+'</span>'
      +'<span class="review-time">'+timeStr+'</span>'
    +'</div>'
    +(r.text ? '<p class="review-text">'+truncate(r.text, 200)+'</p>' : '')
    +'</div>';
}

function renderCards(locales){
  var wrap = document.getElementById('cardsWrap');
  if(!wrap) return;
  var conResenasRecientes = locales.filter(function(l){
    return (l.reviews || []).some(function(r){ return isReviewRecent(r, RESENAS_DIAS_UMBRAL); });
  });
  if(!conResenasRecientes.length){
    wrap.innerHTML = '<div class="card empty">Sin reseñas recientes (últimos '+RESENAS_DIAS_UMBRAL+' días) para esta selección</div>';
    return;
  }
  // Locales con alerta primero; el resto conserva el orden de origen
  conResenasRecientes.sort(function(a,b){ return (b.is_alert?1:0) - (a.is_alert?1:0); });
  wrap.innerHTML = conResenasRecientes.map(function(l){
    var mc = MARCA_COLORS[l.marca] || '#323E48';
    var reviews = (l.reviews || []).filter(function(r){ return isReviewRecent(r, RESENAS_DIAS_UMBRAL); }).slice(0, 3);
    return '<div class="reviews-local" style="--brand:'+mc+'">'
      +'<div class="reviews-local-head"><span title="'+(l.local||'')+'">'+(l.local || '—')+'</span><span>'+fmtRating(l.rating)+' ★</span></div>'
      +reviews.map(reviewCardHtml).join('')
      +'</div>';
  }).join('');
}

var _tendPeriodo = 30; // días — 7 / 30 / 90

function setTendenciaPeriodo(dias, btn){
  _tendPeriodo = dias;
  document.querySelectorAll('#tendCtrl .fb').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  renderTendencia(getLocalesForMarca());
}

function historialKey(l){
  return (l.marca || '') + '__' + (l.local || '');
}

function filtrarHistorialPorPeriodo(historial, dias){
  if(!historial || !historial.length) return [];
  var ahora = new Date();
  var limiteMs = dias * 24 * 60 * 60 * 1000;
  return historial.filter(function(h){
    var f = new Date(h.fecha);
    if(isNaN(f.getTime())) return false;
    return (ahora.getTime() - f.getTime()) <= limiteMs;
  });
}

function buildSparklineSvg(puntos, width, height){
  var ratings = puntos.map(function(p){ return Number(p.rating); });
  var min = Math.min.apply(null, ratings);
  var max = Math.max.apply(null, ratings);
  if(min === max){ min -= 0.5; max += 0.5; }
  var pad = 3, h = height - pad*2;
  var stepX = puntos.length > 1 ? width / (puntos.length - 1) : 0;
  var coords = ratings.map(function(r, i){
    var x = i * stepX;
    var y = pad + h - ((r - min) / (max - min)) * h;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var first = ratings[0], last = ratings[ratings.length - 1];
  var color = last > first ? '#18988B' : (last < first ? '#D41367' : 'rgba(35,31,32,.45)');
  return '<svg viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none">'
    +'<polyline points="'+coords.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +'</svg>';
}

function deltaHtml(puntos){
  var first = Number(puntos[0].rating), last = Number(puntos[puntos.length - 1].rating);
  var diff = Math.round((last - first) * 100) / 100;
  if(diff > 0) return '<span class="pos">▲ +'+diff.toFixed(2).replace('.',',')+'</span>';
  if(diff < 0) return '<span class="neg">▼ '+diff.toFixed(2).replace('.',',')+'</span>';
  return '<span class="muted">sin cambios</span>';
}

function renderTendencia(locales){
  var body = document.getElementById('tendenciaBody');
  if(!body) return;
  if(!locales.length){
    body.innerHTML = '<div class="empty">Sin datos de tendencia para esta selección</div>';
    return;
  }
  var historialMap = (RESENAS && RESENAS.historial) ? RESENAS.historial : {};
  body.innerHTML = locales.map(function(l){
    var hist = historialMap[historialKey(l)] || [];
    var puntos = filtrarHistorialPorPeriodo(hist, _tendPeriodo);
    var spark = '', delta = '<span class="muted" style="font-weight:400">sin datos</span>';
    if(puntos.length >= 2){
      spark = buildSparklineSvg(puntos, 140, 28);
      delta = deltaHtml(puntos);
    }
    return '<div class="trend-row">'
      +'<div class="trend-name" title="'+(l.local || '')+'">'+marcaDot(l.marca)+'<span>'+(l.local || '—')+'</span></div>'
      +'<div class="trend-spark">'+spark+'</div>'
      +'<div class="trend-delta">'+delta+'</div>'
      +'</div>';
  }).join('');
}

function render(){
  updateSnapshotLabel();
  var locales = getLocalesForMarca();

  var warn = document.getElementById('sinDatosWarn');
  if(warn) warn.style.display = locales.length ? 'none' : 'flex';

  renderKpis(locales);
  renderRanking(locales);
  renderCards(locales);
  renderTendencia(locales);
}

render();
</script>
</body>
</html>
