# DESHABILITADO — 2026-08-31. Este workflow corre generar_destileria_dashboard.py
# SIN --gcs-bucket y sube a GCS con un "gsutil cp" directo, lo que bypasea por
# completo el guardrail de integridad (validate_contabilium_integrity, HWM,
# etc.) agregado ese mismo día tras un incidente de facturación incorrecta.
# Ver lesson_destileria-cot-guardrail.md. El trigger automático se sacó a
# propósito — solo queda disponible para disparo manual (workflow_dispatch)
# si alguna vez se re-habilita, y en ese caso hay que agregarle --gcs-bucket
# y sacar el gsutil cp manual antes de volver a activar el push trigger.
name: Update Destilería Dashboard (DESHABILITADO — bypasea el guardrail)

on:
  workflow_dispatch: {}

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Autenticar con GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud / gsutil
        uses: google-github-actions/setup-gcloud@v2

      - name: Generar dashboard
        env:
          PYTHONIOENCODING: utf-8
        run: python generar_destileria_dashboard.py

      - name: Subir a GCS
        run: |
          gsutil -h "Cache-Control:no-cache, no-store, must-revalidate" \
            cp destileria_dashboard.html \
            gs://temple-bar-dashboard-cache/destileria_dashboard.html

      - name: Listo
        run: echo "Dashboard actualizado en GCS correctamente"
