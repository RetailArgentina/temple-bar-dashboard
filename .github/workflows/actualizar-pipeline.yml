name: Actualizar pipeline de tableros

on:
  # Disparador principal: Cloud Scheduler (actualizar-pipeline-0830 / -1200) llama a
  # workflow_dispatch a horario exacto. El cron de GitHub llega con 3-6 h de atraso y
  # queda solo como respaldo: el job "chequeo" lo saltea si ya hubo un dispatch.
  workflow_dispatch: {}
  schedule:
    - cron: "30 11 * * *"   # 08:30 ART (respaldo)
    - cron: "0 15 * * *"    # 12:00 ART (respaldo)

concurrency:
  group: actualizar-pipeline
  cancel-in-progress: false

jobs:
  chequeo:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      correr: ${{ steps.check.outputs.correr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "correr=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Horario nominal de este cron (hoy, UTC): "MM HH * * *"
          read -r MIN HORA _ <<< "$CRON"
          NOMINAL="$(date -u +%Y-%m-%d) $(printf %02d "$HORA"):$(printf %02d "$MIN"):00"
          DESDE=$(date -u -d "$NOMINAL UTC - 10 minutes" +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/actualizar-pipeline.yml/runs?event=workflow_dispatch&created=>=$DESDE" --jq '[.workflow_runs[] | select(.conclusion != "cancelled")] | length')
          echo "Dispatches desde $DESDE: $N"
          if [ "$N" -gt 0 ]; then
            echo "Ya corrió por Cloud Scheduler/manual: salteo el cron de respaldo."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

  actualizar:
    needs: chequeo
    if: needs.chequeo.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # requerido por google-github-actions/auth (WIF)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements_job.txt

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Correr el pipeline
        env:
          CONTABILIUM_EMAIL: ${{ secrets.CONTABILIUM_EMAIL }}
          CONTABILIUM_APIKEY: ${{ secrets.CONTABILIUM_APIKEY }}
          TOTEAT_XIU: ${{ vars.TOTEAT_XIU }}
          TOTEAT_XIR: ${{ vars.TOTEAT_XIR }}
          TOTEAT_XIL: ${{ vars.TOTEAT_XIL }}
          TOTEAT_TOKEN: ${{ secrets.TOTEAT_TOKEN }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PLACES_ID_BARRIO_CHINO: ${{ secrets.PLACES_ID_BARRIO_CHINO }}
          PLACES_ID_MONROE: ${{ secrets.PLACES_ID_MONROE }}
          PYTHONIOENCODING: utf-8
        run: python -X utf8 actualizar_todo.py

      - name: Subir el log si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-update-log
          path: logs/dashboard_update.log
